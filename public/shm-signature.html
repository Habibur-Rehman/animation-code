<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signature</title>
  </head>
  <body
    bgcolor="#FFFFFF"
    leftmargin="0"
    topmargin="0"
    marginwidth="0"
    marginheight="0"
  >
    <table
      width="600"
      align="left"
      border="0"
      cellpadding="0"
      cellspacing="0"
      style="font-family: Arial, sans-serif"
    >
      <tr>
        <td colspan="2">
          <img
            src="https://lead.wlc.org.in/shm/Dots.png"
            width="80"
            height="21"
            alt="dots"
            style="display: block"
          />
        </td>
      </tr>

      <tr>
        <!-- Image column -->
        <td width="200" valign="top" style="padding: 0">
          <img
            src="https://lead.wlc.org.in/shm/md_hajee.png"
            width="200"
            style="display: block; border: 0"
            alt="Mohammed Hajee"
          />
        </td>

        <!-- Text column -->
        <td width="400" valign="top" style="padding: 20px 0 0 20px">
          <p
            style="
              margin: 20px 0 0;
              font-size: 24px;
              font-weight: bold;
              color: #ea5906;
            "
          >
            MOHAMMED HAJEE
          </p>
          <p
            style="
              margin: 0;
              font-size: 13px;
              font-weight: bold;
              color: #8e8f8e;
            "
          >
            DIRECTOR, SHM GROUP
          </p>

          <!-- Contact table -->
          <table
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            style="margin-top: 10px"
          >
            <tr>
              <td
                style="
                  padding-right: 20px;
                  border-right: 1px solid #8e8f8e;
                  font-size: 14px;
                  color: #8e8f8e;
                "
              >
                <strong>M:</strong>
                <a
                  href="tel:+91 9167630448"
                  style="color: #8e8f8e; text-decoration: none"
                  >+91 9167630448</a
                ><br />
                <strong>E:</strong>
                <a
                  href="mailto:msh@shmgroup.com"
                  style="color: #8e8f8e; text-decoration: none"
                  >msh@shmgroup.com</a
                >
              </td>
              <td style="padding-left: 20px; font-size: 14px; color: #8e8f8e">
                <strong>T:</strong>
                <a
                  href="tel:+91 22 6542 5000"
                  style="color: #8e8f8e; text-decoration: none"
                  >+91 22 6542 5000</a
                ><br />
                SHM Shipcare Pvt. Ltd.
              </td>
            </tr>
            <tr>
              <td colspan="2">
                <img
                  src="https://lead.wlc.org.in/shm/Dots.png"
                  width="80"
                  height="21"
                  alt="dots"
                  style="display: block; margin-left: auto; margin-top: 20px"
                />
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <!-- Footer -->
      <tr>
        <td colspan="2">
          <table
            width="600"
            border="0"
            cellpadding="0"
            cellspacing="0"
            bgcolor="#EA5906"
          >
            <tr>
              <!-- Left section: Social icons -->
              <td align="left" valign="middle" style="padding: 20px 20px">
                <table border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td>
                      <a href="https://x.com/SHMShipcare" target="_blank">
                        <img
                          src="https://lead.wlc.org.in/shm/Twitter_Icon.svg"
                          alt="Twitter"
                          width="24"
                          style="display: block"
                        />
                      </a>
                    </td>
                    <td width="10"></td>
                    <td>
                      <img
                        src="https://lead.wlc.org.in/shm/Instagram_Icon.svg"
                        alt="Instagram"
                        width="24"
                        style="display: block"
                      />
                    </td>
                    <td width="10"></td>
                    <td>
                      <a
                        href="https://www.youtube.com/channel/UCJJlITHzby5MVDMWyS70s5g"
                        target="_blank"
                      >
                        <img
                          src="https://lead.wlc.org.in/shm/Youtube_Icon.svg"
                          alt="YouTube"
                          width="24"
                          style="display: block"

                    </td>
                    <td width="10"></td>
                    <td>
                      <img

                          alt="Website"
                          width="24"
                          style="display: block"
                        />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>

              <!-- Right section: Website text -->
              <td align="right" valign="middle" style="padding: 20px 20px">
                <p
                  style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 16px;
                    font-weight: bold;
                    font-family: Arial, sans-serif;
                  "
                >
                  <a
                    href="https://shmgroup.com/"
                    target="_blank"
                    style="color: #ffffff; text-decoration: none"
                  >
                    www.shmgroup.com
                  </a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>

</html>
